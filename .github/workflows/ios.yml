name: iOS
run-name: pocket-ios-${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Publish request identifier
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and verify unsigned IPA
        run: bash scripts/build-ios.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-ios-ipa
          path: out/pocket-ios.ipa
          if-no-files-found: error
          retention-days: 1
